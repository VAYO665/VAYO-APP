
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAYO Taxi</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f5f5f5;
 font-family:Arial,sans-serif;
 color:#171717;
}
header{
 background:#fff;
 padding:16px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
header a{
 color:#171717;
 text-decoration:none;
 font-size:22px;
}
.logo{
 font-size:25px;
 font-weight:900;
}
#map{
 height:43vh;
 min-height:250px;
 z-index:1;
}
.sheet{
 position:relative;
 background:white;
 border-radius:24px 24px 0 0;
 margin-top:-15px;
 padding:20px;
 z-index:2;
 max-width:900px;
 margin-left:auto;
 margin-right:auto;
}
input,textarea,select{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:12px;
 font-size:16px;
 margin:7px 0 12px;
 background:#f7f7f7;
}
button,.btn{
 border:0;
 background:#ffc400;
 color:#171717;
 padding:14px;
 border-radius:13px;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
 text-decoration:none;
 display:inline-block;
}
button:disabled{opacity:.5}
.full{width:100%}
.gray{background:#eee}
.red{background:#dc2626;color:white}
.green{background:#16a34a;color:white}
.row{
 display:flex;
 gap:8px;
 align-items:center;
}
.row input{flex:1;min-width:0}
.cars{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 margin:16px 0;
}
.car{
 background:#f7f7f7;
 border:2px solid transparent;
 padding:12px 5px;
 border-radius:16px;
 text-align:center;
 cursor:pointer;
}
.car.active{
 border-color:#ffc400;
 background:#fff9df;
}
.carIcon{font-size:35px}
.carName{
 font-size:13px;
 font-weight:bold;
 margin:8px 0;
}
.carPrice{
 font-size:14px;
 font-weight:bold;
}
.notice{
 padding:12px;
 border-radius:12px;
 background:#fff2c2;
 margin:12px 0;
 overflow-wrap:anywhere;
}
.notice:empty{display:none}
.card{
 padding:16px;
 background:#f7f7f7;
 border-radius:16px;
 margin:12px 0;
 overflow-wrap:anywhere;
}
.price{
 font-size:30px;
 font-weight:900;
}
.hidden{display:none!important}
dialog{
 border:0;
 border-radius:22px;
 width:min(94%,480px);
 max-height:90vh;
 overflow:auto;
 padding:22px;
}
dialog::backdrop{background:#0008}
.badge{
 display:inline-block;
 background:#fff0bf;
 padding:8px 12px;
 border-radius:20px;
 font-size:13px;
}
small{color:#777}
.menu{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:15px;
}
.menu a{
 font-size:13px;
}
@media(max-width:450px){
 .sheet{padding:15px}
 .carIcon{font-size:28px}
 .carName{font-size:11px}
 .carPrice{font-size:12px}
}
</style>
</head>

<body>

<header>
<a href="./index.html">←</a>
<div class="logo">VAYO <span style="color:#d9a500">TAXI</span></div>
<a href="./account.html">👤</a>
</header>

<div id="map"></div>

<div class="sheet">

<div id="notice" class="notice" role="status"></div>

<section id="bookingSection">

<h2>Ба куҷо меравед?</h2>

<label>🟢 Аз куҷо</label>

<div class="row">

<input id="fromAddress"
placeholder="Суроғаи шумо">

<button onclick="searchAddress('from')">🔍</button>

<button onclick="getGPS()">📍</button>

</div>

<button class="gray"
onclick="pickPoint('from')">
Интихоб аз харита
</button>

<br><br>

<label>🔴 Ба куҷо</label>

<div class="row">

<input id="toAddress"
placeholder="Ҷойи таъинот">

<button onclick="searchAddress('to')">🔍</button>

</div>

<button class="gray"
onclick="pickPoint('to')">
Интихоб аз харита
</button>

<label style="display:block;margin-top:15px">
Шаҳр
</label>

<select id="city">

<option>Душанбе</option>
<option>Хуҷанд</option>
<option>Бохтар</option>
<option>Кӯлоб</option>
<option>Ҳисор</option>
<option>Данғара</option>
<option>Ваҳдат</option>

</select>

<div id="cars" class="cars"></div>

<div class="card">

<small>Нархи тахминии сафар</small>

<div id="tripPrice" class="price">—</div>

<p id="tripInfo">Масирро интихоб кунед.</p>

<small>Комиссияи VAYO: 0%</small>

</div>

<button id="orderButton"
class="full"
onclick="openBooking()" disabled>

Фармоиш додани таксӣ

</button>

</section>

<section id="activeSection" class="hidden">

<div id="activeContent"></div>

</section>

<div class="menu">

<button class="gray" onclick="openHistory()">
📋 Таърихи сафарҳо
</button>

<a class="btn gray" href="./driver.html">
🚕 Ронанда шудан
</a>

</div>

</div>

<dialog id="bookingDialog">

<h2>Тасдиқи фармоиш</h2>

<div id="bookingError" class="notice"></div>

<form id="bookingForm">

<label>Ному насаб</label>

<input id="customerName" required maxlength="100">

<label>Телефон</label>

<input id="customerPhone"
type="tel"
placeholder="+992900000000" required>

<label>Шарҳ барои ронанда</label>

<textarea id="note"
maxlength="500"
placeholder="Масалан: назди даромадгоҳ"></textarea>

<label>

<input id="callOnArrival"
type="checkbox"
style="width:auto"
checked>

Ҳангоми расидан занг занад

</label>

<div class="card">

<p>Пардохт: нақдӣ</p>

<strong id="bookingPrice"></strong>

</div>

<button id="confirmButton"
class="full"
type="submit">

Тасдиқ кардани фармоиш

</button>

<br><br>

<button class="gray full"
type="button"
onclick="document.getElementById('bookingDialog').close()">

Бекор

</button>

</form>

</dialog>

<dialog id="historyDialog">

<h2>Таърихи сафарҳо</h2>

<div id="historyList"></div>

<button class="gray full"
onclick="document.getElementById('historyDialog').close()">

Пӯшидан

</button>

</dialog>

<script>

const db = window.vayo;
const $ = id => document.getElementById(id);

let user = null;
let tariffs = [];
let selectedClass = "economy";

let points = {
 from:null,
 to:null
};

let markers = {
 from:null,
 to:null
};

let versions = {
 from:0,
 to:0
};

let routeLine = null;
let driverMarker = null;

let routeVersion = 0;
let routeController = null;

let distanceKm = 0;
let durationMin = 0;
let routeReady = false;

let pickMode = null;
let activeOrder = null;

let busy = false;
let refreshing = false;

let geoQueue = Promise.resolve();
let lastGeoRequest = 0;

const classNames = {

 economy:"Эконом",
 comfort:"Комфорт",
 business:"Бизнес",
 minivan:"Минивэн"

};

const statuses = {

 searching:"Ҷустуҷӯи ронанда...",
 accepted:"Ронанда фармоишро қабул кард",
 arrived:"Ронанда расид",
 in_progress:"Сафар оғоз шуд",
 completed:"Сафар анҷом ёфт",
 cancelled:"Сафар бекор шуд"

};

function esc(value){

 return String(value ?? "").replace(
 /[&<>"']/g,
 c=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
 })[c]);

}

function notice(text){

 $("notice").textContent = text || "";

}

function money(value){

 return Number(value || 0).toFixed(2)+" TJS";

}

function normalizePhone(value){

 let p = value.replace(/[\s()-]/g,"");

 if(/^\d{9}$/.test(p)) p = "+992"+p;

 if(/^992\d{9}$/.test(p)) p = "+"+p;

 if(!/^\+992\d{9}$/.test(p)){

  throw new Error("Рақами телефон нодуруст.");

 }

 return p;

}

async function rpc(name,args={}){

 const {data,error} = await db.rpc(name,args);

 if(error) throw error;

 return data;

}

const map = L.map("map").setView(

 [38.5598,68.7870],13

);

L.tileLayer(

 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

 {

  maxZoom:19,

  attribution:"&copy; OpenStreetMap contributors"

 }

).addTo(map);

function markerIcon(color){

 return L.divIcon({

  className:"",

  html:`<div style="
  width:23px;height:23px;
  background:${color};
  border:4px solid white;
  border-radius:50%;
  box-shadow:0 2px 8px #0005">
  </div>`,

  iconSize:[23,23],

  iconAnchor:[11,11]

 });

}

function setMarker(type,lat,lng){

 if(markers[type]){

  markers[type].setLatLng([lat,lng]);

 }else{

  markers[type] = L.marker([lat,lng],{

   icon:markerIcon(
   type==="from"?"#16a34a":"#dc2626"
   )

  }).addTo(map);

 }

}

async function geoRequest(url){

 const task = geoQueue.catch(()=>{}).then(async()=>{

  const wait = Math.max(
   0,1100-(Date.now()-lastGeoRequest)
  );

  await new Promise(resolve=>
   setTimeout(resolve,wait)
  );

  lastGeoRequest = Date.now();

  const response = await fetch(url);

  if(!response.ok){

   throw new Error("Ҷустуҷӯи суроға дастрас нест.");

  }

  return response.json();

 });

 geoQueue = task;

 return task;

}

function invalidateRoute(){

 routeVersion++;

 routeReady = false;

 distanceKm = 0;

 durationMin = 0;

 if(routeController){

  routeController.abort();

 }

 if(routeLine){

  map.removeLayer(routeLine);

  routeLine = null;

 }

 updatePrice();

}

function clearPoint(type){

 versions[type]++;

 points[type] = null;

 if(markers[type]){

  map.removeLayer(markers[type]);

  markers[type] = null;

 }

 invalidateRoute();

}

async function setPoint(type,lat,lng,address){

 if(activeOrder || busy) return;

 points[type] = {

  lat:Number(lat),

  lng:Number(lng),

  address

 };

 $(type+"Address").value = address;

 setMarker(type,lat,lng);

 invalidateRoute();

 if(points.from && points.to){

  await calculateRoute();

 }else{

  map.setView([lat,lng],15);

 }

}

async function searchAddress(type){

 if(activeOrder || busy) return;

 const text = $(type+"Address").value.trim();

 if(!text){

  notice("Суроғаро ворид кунед.");

  return;

 }

 clearPoint(type);

 const version = versions[type];

 try{

 notice("Ҷустуҷӯи суроға...");

 const url =

 "https://nominatim.openstreetmap.org/search?"

 +new URLSearchParams({

  format:"jsonv2",

  q:text+", "+$("city").value+", Тоҷикистон",

  countrycodes:"tj",

  limit:"5",

  "accept-language":"tg,ru,en"

 });

 const data = await geoRequest(url);

 if(version!==versions[type]) return;

 if(!data.length){

  throw new Error(
  "Суроға ёфт нашуд. Аз харита интихоб кунед."
  );

 }

 let item = data[0];

 if(data.length>1){

 const answer = prompt(

  "Суроғаро интихоб кунед:\n"+

  data.map((d,i)=>
   (i+1)+". "+d.display_name
  ).join("\n"),

  "1"

 );

 if(answer===null){

  notice("");

  return;

 }

 const index = Number(answer)-1;

 if(!Number.isInteger(index) || !data[index]){

  throw new Error("Интихоб нодуруст.");

 }

 item = data[index];

 }

 await setPoint(

  type,

  Number(item.lat),

  Number(item.lon),

  item.display_name

 );

 notice("");

 }catch(error){

 notice(error.message);

 }

}

function pickPoint(type){

 if(activeOrder || busy) return;

 pickMode = type;

 notice(

 type==="from"

 ? "Ҷойи гирифтани мусофирро дар харита пахш кунед."

 : "Ҷойи таъинотро дар харита пахш кунед."

 );

}

async function reversePoint(type,lat,lng){

 clearPoint(type);

 const version = versions[type];

 let address =

 lat.toFixed(5)+", "+lng.toFixed(5);

 await setPoint(type,lat,lng,address);

 try{

 const data = await geoRequest(

 "https://nominatim.openstreetmap.org/reverse?"

 +new URLSearchParams({

  format:"jsonv2",

  lat:String(lat),

  lon:String(lng),

  "accept-language":"tg,ru,en"

 })

 );

 if(version!==versions[type]) return;

 if(points[type] && data.display_name){

  points[type].address = data.display_name;

  $(type+"Address").value = data.display_name;

 }

 }catch{}

}

map.on("click",async event=>{

 if(!pickMode || activeOrder || busy) return;

 const type = pickMode;

 pickMode = null;

 await reversePoint(

  type,

  event.latlng.lat,

  event.latlng.lng

 );

 notice("");

});

function getGPS(){

 if(activeOrder || busy) return;

 if(!navigator.geolocation){

  notice("GPS дастрас нест.");

  return;

 }

 const version = ++versions.from;

 notice("GPS ҷустуҷӯ мешавад...");

 navigator.geolocation.getCurrentPosition(

 async position=>{

 if(version!==versions.from) return;

 await reversePoint(

  "from",

  position.coords.latitude,

  position.coords.longitude

 );

 notice("");

 },

 error=>notice("GPS: "+error.message),

 {

  enableHighAccuracy:true,

  timeout:20000,

  maximumAge:5000

 }

 );

}

async function calculateRoute(){

 if(!points.from || !points.to) return;

 const version = ++routeVersion;

 routeController = new AbortController();

 const from = points.from;

 const to = points.to;

 try{

 const url =

 "https://router.project-osrm.org/route/v1/driving/"

 +from.lng+","+from.lat+";"

 +to.lng+","+to.lat

 +"?overview=full&geometries=geojson";

 const response = await fetch(url,{

  signal:routeController.signal

 });

 if(!response.ok){

  throw new Error("Хатои масир.");

 }

 const data = await response.json();

 if(version!==routeVersion) return;

 if(data.code!=="Ok" || !data.routes?.length){

  throw new Error("Масир ёфт нашуд.");

 }

 const route = data.routes[0];

 distanceKm = Math.max(

  0.1,

  Math.round(route.distance/10)/100

 );

 durationMin = Math.max(

  1,

  Math.ceil(route.duration/60)

 );

 routeLine = L.geoJSON(route.geometry,{

  style:{

   color:"#e6a900",

   weight:6

  }

 }).addTo(map);

 map.fitBounds(routeLine.getBounds(),{

  padding:[30,30],

  maxZoom:17

 });

 routeReady = true;

 updatePrice();

 }catch(error){

 if(error.name==="AbortError") return;

 if(version!==routeVersion) return;

 routeReady = false;

 updatePrice();

 notice(error.message);

 }

}

async function loadTariffs(){

 const {data,error} = await db

 .from("taxi_tariffs")

 .select("*")

 .eq("active",true);

 if(error) throw error;

 const order = [

  "economy","comfort","business","minivan"

 ];

 tariffs = (data || []).sort(

 (a,b)=>order.indexOf(a.car_class)

 -order.indexOf(b.car_class)

 );

 if(!tariffs.some(t=>t.car_class===selectedClass)){

  selectedClass = tariffs[0]?.car_class || "";

 }

 updatePrice();

}

function calculatePrice(tariff){

 if(!routeReady || !tariff) return null;

 return Math.round((

  Number(tariff.base_price)

  +distanceKm*Number(tariff.price_per_km)

 )*100)/100;

}

function updatePrice(){

 $("cars").innerHTML = tariffs.map(t=>{

 const price = calculatePrice(t);

 return `

 <button class="car ${t.car_class===selectedClass?"active":""}"

 data-class="${esc(t.car_class)}">

 <div class="carIcon">

 ${t.car_class==="minivan"?"🚐":"🚕"}

 </div>

 <div class="carName">

 ${esc(classNames[t.car_class] || t.name)}

 </div>

 <div class="carPrice">

 ${price===null?"—":esc(money(price))}

 </div>

 </button>

 `;

 }).join("");

 const tariff = tariffs.find(t=>

 t.car_class===selectedClass

 );

 const price = calculatePrice(tariff);

 $("tripPrice").textContent =

 price===null?"—":money(price);

 $("tripInfo").textContent = routeReady

 ? distanceKm+" км · "+durationMin+" дақиқа"

 : "Масирро интихоб кунед.";

 $("orderButton").disabled =

 !routeReady || !tariff || busy || !!activeOrder;

}

$("cars").addEventListener("click",event=>{

 const b = event.target.closest("[data-class]");

 if(!b || busy) return;

 selectedClass = b.dataset.class;

 updatePrice();

});

["from","to"].forEach(type=>{

 $(type+"Address").addEventListener("input",()=>{

  clearPoint(type);

 });

});

$("city").addEventListener("change",()=>{

 clearPoint("from");

 clearPoint("to");

 $("fromAddress").value = "";

 $("toAddress").value = "";

});

async function requireUser(){

 const {data,error} = await db.auth.getUser();

 if(error || !data.user){

  if(confirm("Барои фармоиш ба аккаунт ворид шавед.")){

   location.href = "./account.html";

  }

  return null;

 }

 user = data.user;

 return user;

}

async function openBooking(){

 if(busy || !routeReady || activeOrder) return;

 if(!await requireUser()) return;

 await refreshActive();

 if(activeOrder) return;

 if(!routeReady || !points.from || !points.to) return;

 const tariff = tariffs.find(t=>

 t.car_class===selectedClass

 );

 if(!tariff) return;

 $("customerName").value =

 user.user_metadata?.full_name || "";

 $("customerPhone").value =

 user.user_metadata?.phone || "";

 $("bookingPrice").textContent =

 "Нархи тахминӣ: "+money(calculatePrice(tariff));

 $("bookingError").textContent = "";

 $("bookingDialog").showModal();

}

$("bookingForm").addEventListener("submit",async event=>{

 event.preventDefault();

 if(busy || !routeReady || activeOrder) return;

 busy = true;

 $("confirmButton").disabled = true;

 updatePrice();

 $("bookingError").textContent = "";

 try{

 const name = $("customerName").value.trim();

 if(!name) throw new Error("Номро ворид кунед.");

 const phone = normalizePhone(

  $("customerPhone").value

 );

 const from = points.from;

 const to = points.to;

 if(!from || !to){

  throw new Error("Масирро интихоб кунед.");

 }

 const id = await rpc(

 "vayo_create_taxi_order",{

  p_customer_name:name,

  p_customer_phone:phone,

  p_pickup_address:from.address,

  p_destination_address:to.address,

  p_pickup_lat:from.lat,

  p_pickup_lng:from.lng,

  p_destination_lat:to.lat,

  p_destination_lng:to.lng,

  p_car_class:selectedClass,

  p_distance_km:distanceKm,

  p_duration_min:durationMin,

  p_city:$("city").value,

  p_note:$("note").value.trim(),

  p_call_on_arrival:$("callOnArrival").checked

 }

 );

 $("bookingDialog").close();

 notice("Фармоиш сабт шуд. Ронанда ҷустуҷӯ мешавад.");

 await refreshActive();

 }catch(error){

 $("bookingError").textContent = error.message;

 }finally{

 busy = false;

 $("confirmButton").disabled = false;

 updatePrice();

 }

});

async function refreshActive(){

 if(!user || refreshing) return;

 refreshing = true;

 try{

 const {data,error} = await db

 .from("taxi_orders")

 .select("*")

 .eq("customer_id",user.id)

 .in("status",[

  "searching",

  "accepted",

  "arrived",

  "in_progress"

 ])

 .order("created_at",{ascending:false})

 .limit(1)

 .maybeSingle();

 if(error) throw error;

 const previous = activeOrder;

 activeOrder = data;

 if(!activeOrder){

 $("bookingSection").classList.remove("hidden");

 $("activeSection").classList.add("hidden");

 if(driverMarker){

  map.removeLayer(driverMarker);

  driverMarker = null;

 }

 if(previous){

  notice("Сафари фаъол анҷом ёфт ё бекор шуд.");

 }

 updatePrice();

 return;

 }

 $("bookingSection").classList.add("hidden");

 $("activeSection").classList.remove("hidden");

 if($("bookingDialog").open){

  $("bookingDialog").close();

 }

 if(!previous || previous.id!==activeOrder.id){

  showOrderMap(activeOrder);

 }

 await renderActive();

 }catch(error){

 notice(error.message);

 }finally{

 refreshing = false;

 }

}

function showOrderMap(o){

 invalidateRoute();

 setMarker("from",o.pickup_lat,o.pickup_lng);

 setMarker(

  "to",

  o.destination_lat,

  o.destination_lng

 );

 const positions = [

  [o.pickup_lat,o.pickup_lng],

  [o.destination_lat,o.destination_lng]

 ];

 routeLine = L.polyline(positions,{

  color:"#e6a900",

  weight:4,

  dashArray:"8 8"

 }).addTo(map);

 map.fitBounds(positions,{

  padding:[30,30],

  maxZoom:16

 });

}

async function renderActive(){

 const o = activeOrder;

 if(!o) return;

 let driver = null;

 if(o.driver_id){

 const result = await rpc(

 "vayo_my_taxi_driver",{

  p_order_id:o.id

 }

 );

 driver = Array.isArray(result)

 ? result[0]

 : result;

 }

 let driverHTML = "";

 if(driver){

 const tel = String(driver.phone || "")

 .replace(/[^\d+]/g,"");

 driverHTML = `

 <div class="card">

 <h3>🚕 Ронандаи шумо</h3>

 <p>👤 ${esc(driver.full_name)}</p>

 <p>${esc(driver.car_brand)}

 ${esc(driver.car_model)}</p>

 <p>Ранг: ${esc(driver.car_color)}</p>

 <h2>${esc(driver.car_number)}</h2>

 <a class="btn green"

 href="tel:${esc(tel)}">

 📞 Занг задан

 </a>

 </div>

 `;

 const fresh = driver.location_updated_at

 && Date.now()-new Date(

 driver.location_updated_at

 ).getTime()<120000;

 if(fresh

 && driver.latitude!==null

 && driver.longitude!==null){

 const coords = [

  driver.latitude,

  driver.longitude

 ];

 if(!driverMarker){

 driverMarker = L.marker(coords,{

  icon:L.divIcon({

   className:"",

   html:'<div style="font-size:32px">🚕</div>',

   iconSize:[36,36],

   iconAnchor:[18,18]

  })

 }).addTo(map);

 }else{

 driverMarker.setLatLng(coords);

 }

 }else if(driverMarker){

 map.removeLayer(driverMarker);

 driverMarker = null;

 }

 }

 $("activeContent").innerHTML = `

 <h2>${esc(statuses[o.status] || o.status)}</h2>

 <span class="badge">

 Фармоиш #${esc(o.id.slice(0,8))}

 </span>

 <div class="card">

 <p>🟢 ${esc(o.pickup_address)}</p>

 <p>🔴 ${esc(o.destination_address)}</p>

 <p>${esc(o.distance_km)} км ·

 ${esc(o.duration_min)} дақиқа</p>

 <div class="price">

 ${esc(money(o.price))}

 </div>

 <p>Пардохт: нақдӣ</p>

 </div>

 ${driverHTML}

 ${["searching","accepted"].includes(o.status)

 ? `<button class="red full"

 onclick="cancelOrder()">

 Бекор кардани фармоиш

 </button>`

 : ""}

 `;

}

async function cancelOrder(){

 if(!activeOrder || busy) return;

 if(!confirm("Фармоишро бекор мекунед?")) return;

 busy = true;

 try{

 await rpc("vayo_taxi_status",{

  p_order_id:activeOrder.id,

  p_status:"cancelled"

 });

 await refreshActive();

 notice("Фармоиш бекор шуд.");

 }catch(error){

 notice(error.message);

 }finally{

 busy = false;

 updatePrice();

 }

}

async function openHistory(){

 if(!await requireUser()) return;

 $("historyList").textContent = "Боргирӣ...";

 $("historyDialog").showModal();

 try{

 const {data,error} = await db

 .from("taxi_orders")

 .select("*")

 .eq("customer_id",user.id)

 .order("created_at",{ascending:false})

 .limit(100);

 if(error) throw error;

 $("historyList").innerHTML =

 (data || []).map(o=>`

 <div class="card">

 <span class="badge">

 ${esc(statuses[o.status] || o.status)}

 </span>

 <p>${esc(new Date(o.created_at)

 .toLocaleString("ru-RU",{

  timeZone:"Asia/Dushanbe"

 }))}</p>

 <p>🟢 ${esc(o.pickup_address)}</p>

 <p>🔴 ${esc(o.destination_address)}</p>

 <strong>${esc(money(o.price))}</strong>

 </div>

 `).join("") || "<p>Ҳоло сафар надоред.</p>";

 }catch(error){

 $("historyList").textContent = error.message;

 }

}

async function start(){

 try{

 if(!db){

  throw new Error("config.js ёфт нашуд.");

 }

 await loadTariffs();

 const {data} = await db.auth.getUser();

 user = data?.user || null;

 if(user){

  await refreshActive();

 }

 }catch(error){

 notice(error.message);

 }

}

setInterval(async()=>{

 if(!user || busy

 || document.visibilityState!=="visible") return;

 await refreshActive();

},6000);

start();

</script>

</body>
