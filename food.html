
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAYO Food</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f7f7f7;
 color:#202124;
 font-family:Arial,sans-serif;
}
header{
 background:white;
 padding:16px;
 position:sticky;
 top:0;
 z-index:10;
 border-bottom:1px solid #eee;
}
.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}
.logo{
 font-size:26px;
 font-weight:900;
 color:#ff6500;
}
a{
 color:inherit;
 text-decoration:none;
}
main{
 max-width:1100px;
 margin:auto;
 padding:15px 15px 100px;
}
input,select,textarea{
 width:100%;
 padding:13px;
 border:1px solid #ddd;
 border-radius:12px;
 background:#f7f7f7;
 font-size:16px;
 margin:8px 0 12px;
}
button,.btn{
 border:0;
 border-radius:13px;
 padding:13px 16px;
 background:#ff6500;
 color:white;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
 display:inline-block;
}
button:disabled{
 opacity:.5;
 cursor:not-allowed;
}
.full{width:100%}
.gray{background:#eee;color:#222}
.green{background:#16a34a}
.red{background:#dc2626}
.hero{
 background:linear-gradient(120deg,#ff6500,#ff9c38);
 color:white;
 border-radius:24px;
 padding:25px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:20px;
}
.hero h1{
 font-size:27px;
 margin:0;
}
.hero p{
 line-height:1.5;
}
.heroIcon{font-size:75px}
.categories{
 display:flex;
 gap:10px;
 overflow:auto;
 margin-bottom:20px;
 padding-bottom:5px;
}
.category{
 flex-shrink:0;
 background:white;
 color:#222;
 border:1px solid #eee;
}
.category.active{
 background:#ff6500;
 color:white;
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}
.card{
 background:white;
 border-radius:18px;
 overflow:hidden;
 border:1px solid #eee;
}
.cardBody{
 padding:13px;
 overflow-wrap:anywhere;
}
.cover{
 width:100%;
 height:155px;
 object-fit:cover;
 display:block;
}
.placeholder{
 height:155px;
 background:#fff0df;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:65px;
}
.price{
 font-size:21px;
 font-weight:900;
 color:#ff6500;
}
.oldPrice{
 color:#999;
 text-decoration:line-through;
 font-size:13px;
}
small{color:#777}
.badge{
 display:inline-block;
 background:#fff0df;
 color:#b45309;
 padding:6px 10px;
 border-radius:20px;
 font-size:12px;
}
.open{
 background:#dcfce7;
 color:#15803d;
}
.hidden{display:none!important}
.notice{
 padding:13px;
 background:#fff0df;
 border-radius:12px;
 margin-bottom:12px;
 overflow-wrap:anywhere;
}
.notice:empty{display:none}
.empty{
 background:white;
 padding:35px 15px;
 border-radius:18px;
 text-align:center;
 color:#777;
}
nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 display:flex;
 justify-content:space-around;
 background:white;
 border-top:1px solid #ddd;
 padding:12px 4px;
 z-index:20;
}
nav button,nav a{
 color:#555;
 background:transparent;
 font-size:12px;
 text-align:center;
 padding:5px;
}
nav span{
 display:block;
 font-size:24px;
 margin-bottom:5px;
}
nav .active{color:#ff6500}
dialog{
 border:0;
 border-radius:22px;
 width:min(95%,520px);
 max-height:90vh;
 overflow:auto;
 padding:20px;
}
dialog::backdrop{
 background:#0008;
}
.row{
 display:flex;
 align-items:center;
 gap:10px;
}
.between{
 justify-content:space-between;
}
.cartItem{
 padding:12px 0;
 border-bottom:1px solid #eee;
}
.qty{
 display:flex;
 align-items:center;
 gap:12px;
}
.qty button{
 padding:8px 13px;
}
.panel{
 background:white;
 border-radius:18px;
 padding:17px;
 margin-bottom:14px;
 overflow-wrap:anywhere;
}
.total{
 font-size:24px;
 font-weight:bold;
 color:#ff6500;
}
.steps{
 display:flex;
 flex-direction:column;
 gap:12px;
 margin:18px 0;
}
.step{
 color:#999;
}
.step.done{
 color:#16a34a;
 font-weight:bold;
}
.restaurantTitle{
 font-size:25px;
 margin:12px 0;
}
.menuLinks{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:20px;
}
.menuLinks a{
 font-size:13px;
}
@media(min-width:750px){
 .grid{
 grid-template-columns:repeat(4,minmax(0,1fr));
 }
 .cover,.placeholder{height:180px}
}
</style>
</head>

<body>

<header>

<div class="top">

<a href="./index.html">←</a>

<div class="logo">VAYO FOOD</div>

</div>

<input id="search"
placeholder="🔍 Таом ё тарабхонаро ҷустуҷӯ кунед">

<select id="city">

<option>Душанбе</option>
<option>Хуҷанд</option>

<option>Данғара</option>

<main>

<div class="hero">

<div>

<h1>Таоми дӯстдоштаатон!</h1>

<p>Аз тарабхона фармоиш диҳед.</p>

<strong>Комиссияи VAYO — 0%</strong>

</div>

<script>

const db = window.vayo;
const $ = id => document.getElementById(id);

let user = null;
let restaurants = [];
let foods = [];
let favorites = new Set();

let currentRestaurant = null;
let selectedCategory = "Ҳама";
let currentScreen = "homeScreen";

let cart = [];
let gps = null;
let gpsVersion = 0;
let busy = false;
let loadingOrders = false;
let catalogVersion = 0;
let checkoutSnapshot = "";

const categories = [
 ["Ҳама","🍽"],
 ["Ош","🍚"],
 ["Бургер","🍔"],
 ["Пицца","🍕"],
 ["Шашлик","🍢"],
 ["Самбӯса","🥟"],
 ["Нӯшокӣ","🥤"],
 ["Ширинӣ","🍰"]
];

const statuses = {
 pending:"Интизори тарабхона",
 accepted:"Тарабхона қабул кард",
 preparing:"Таом омода мешавад",
 ready:"Таом омода аст",
 delivering:"Расонанда дар роҳ аст",
 completed:"Расонида шуд",
 cancelled:"Бекор шуд"
};

function esc(value){

 return String(value ?? "").replace(
 /[&<>"']/g,
 c=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
 })[c]);

}

function safeURL(value){

 try{

 const url = new URL(value);

 return url.protocol==="https:"
 ? url.href
 : "";

 }catch{

 return "";

 }

}

function money(value){

 return Number(value || 0).toFixed(2)+" TJS";

}

function notice(text){

 $("notice").textContent = text || "";

}

function normalizePhone(value){

 let p = value.replace(/[\s()-]/g,"");

 if(/^\d{9}$/.test(p)) p = "+992"+p;

 if(/^992\d{9}$/.test(p)) p = "+"+p;

 if(!/^\+992\d{9}$/.test(p)){

  throw new Error("Рақами телефон нодуруст.");

 }

 return p;

}

function imageHTML(url,emoji){

 const src = safeURL(url);

 return src

 ? `<img class="cover"
 loading="lazy"
 src="${esc(src)}" alt="">`

 : `<div class="placeholder">${emoji}</div>`;

}

function currentPrice(food){

 const now = Date.now();

 if(food.sale_price!==null
 && food.sale_start
 && food.sale_end
 && now>=new Date(food.sale_start).getTime()
 && now<new Date(food.sale_end).getTime()){

  return Number(food.sale_price);

 }

 return Number(food.price);

}

async function rpc(name,args={}){

 const {data,error} = await db.rpc(name,args);

 if(error) throw error;

 return data;

}

async function requireUser(){

 const {data,error} = await db.auth.getUser();

 if(error || !data.user){

  if(confirm("Аввал ба аккаунт ворид шавед.")){

   location.href = "./account.html";

  }

  return null;

 }

 if(!user || user.id!==data.user.id){

  user = data.user;

  readCart();

  await loadFavorites();

 }

 return user;

}

function cartKey(){

 return "vayo_food_cart_v5_"
 +(user?.id || "guest");

}

function readCart(){

 try{

 const saved = JSON.parse(
 localStorage.getItem(cartKey()) || "[]"
 );

 cart = Array.isArray(saved)

 ? saved.filter(i=>
 typeof i.id==="string"
 && Number.isInteger(i.quantity)
 && i.quantity>=1
 && i.quantity<=99
 )

 : [];

 }catch{

 cart = [];

 }

 updateCartCount();

}

function saveCart(){

 try{

 localStorage.setItem(
 cartKey(),JSON.stringify(cart)
 );

 }catch{}

 updateCartCount();

}

function updateCartCount(){

 $("cartCount").textContent =

 cart.reduce((sum,i)=>sum+i.quantity,0);

}

function showScreen(id){

 currentScreen = id;

 [
 "homeScreen",
 "restaurantScreen",
 "ordersScreen",
 "favoritesScreen"
 ].forEach(name=>{

 $(name).classList.toggle(
 "hidden",name!==id
 );

 });

 window.scrollTo(0,0);

}

function renderCategories(){

 $("categories").innerHTML =

 categories.map(([name,emoji])=>`

 <button class="category
 ${selectedCategory===name?"active":""}"

 data-category="${esc(name)}">

 ${emoji} ${esc(name)}

 </button>

 `).join("");

}

async function loadCatalog(){

 const version = ++catalogVersion;

 const city = $("city").value;

 const {data,error} = await db

 .from("restaurants")

 .select("*")

 .eq("approved",true)

 .eq("city",city)

 .order("created_at",{ascending:false})

 .limit(300);

 if(error) throw error;

 if(version!==catalogVersion) return;

 const list = data || [];

 let menu = [];

 if(list.length){

 const {data:items,error:itemError} = await db

 .from("food_items")

 .select("*")

 .in("restaurant_id",list.map(r=>r.id))

 .eq("available",true)

 .limit(1000);

 if(itemError) throw itemError;

 menu = items || [];

 }

 if(version!==catalogVersion) return;

 restaurants = list;

 foods = menu;

 renderHome();

}

function restaurantCard(r){

 return `

 <article class="card">

 <div data-action="restaurant"
 data-id="${esc(r.id)}">

 ${imageHTML(r.cover_url || r.logo_url,"🍽")}

 </div>

 <div class="cardBody">

 <span class="badge ${r.is_open?"open":""}">

 ${r.is_open?"Кушода":"Пӯшида"}

 </span>

 <h3>${esc(r.name)}</h3>

 <small>${esc(r.category || "Тарабхона")}</small>

 <p>📍 ${esc(r.address)}</p>

 <p>🛵 ${esc(money(r.delivery_fee))}</p>

 <div class="row">

 <button data-action="restaurant"
 data-id="${esc(r.id)}">

 Меню

 </button>

 <button class="gray"
 data-action="favorite"
 data-id="${esc(r.id)}">

 ${favorites.has(r.id)?"❤️":"🤍"}

 </button>

 </div>

 </div>

 </article>

 `;

}

function foodCard(f){

 const r = restaurants.find(
 r=>r.id===f.restaurant_id
 );

 const price = currentPrice(f);

 return `

 <article class="card">

 ${imageHTML(f.image_url,"🍲")}

 <div class="cardBody">

 <h3>${esc(f.name)}</h3>

 <small>${esc(r?.name || "")}</small>

 <p>${esc(f.description)}</p>

 <p>⏱ ${esc(f.preparation_minutes)} дақ.</p>

 <div class="price">${esc(money(price))}</div>

 ${price<Number(f.price)

 ? `<div class="oldPrice">
 ${esc(money(f.price))}
 </div>`

 : ""}

 <br>

 <button class="full"
 data-action="add"
 data-id="${esc(f.id)}"
 ${r?.is_open?"":"disabled"}>

 ${r?.is_open?"＋ Ба сабад":"Пӯшида"}

 </button>

 </div>

 </article>

 `;

}

function renderHome(){

 const q = $("search").value.trim().toLowerCase();

 const filteredFoods = foods.filter(f=>{

 const r = restaurants.find(
 r=>r.id===f.restaurant_id
 );

 const text = [

 f.name,
 f.description,
 f.category,
 r?.name

 ].join(" ").toLowerCase();

 return text.includes(q)

 && (

 selectedCategory==="Ҳама"

 || String(f.category).toLowerCase()

 .includes(selectedCategory.toLowerCase())

 );

 });

 const filteredRestaurants = restaurants.filter(r=>{

 const matches =

 [r.name,r.category,r.address]

 .join(" ").toLowerCase().includes(q);

 const menuMatches = filteredFoods.some(

 f=>f.restaurant_id===r.id

 );

 return selectedCategory==="Ҳама"

 ? matches || menuMatches

 : menuMatches;

 });

 $("restaurants").innerHTML =

 filteredRestaurants.map(restaurantCard).join("")

 || '<div class="empty">Тарабхона ёфт нашуд.</div>';

 $("foods").innerHTML =

 filteredFoods.map(foodCard).join("")

 || '<div class="empty">Таом ёфт нашуд.</div>';

}

function goHome(){

 notice("");

 showScreen("homeScreen");

 renderHome();

}

function openRestaurant(id){

 const r = restaurants.find(r=>r.id===id);

 if(!r) return;

 currentRestaurant = r;

 $("restaurantInfo").innerHTML = `

 <div class="panel">

 ${imageHTML(r.cover_url || r.logo_url,"🍽")}

 <h1 class="restaurantTitle">${esc(r.name)}</h1>

 <span class="badge ${r.is_open?"open":""}">

 ${r.is_open?"Кушода":"Пӯшида"}

 </span>

 <p>${esc(r.description || "")}</p>

 <p>📍 ${esc(r.address)}</p>

 <p>🕐 ${esc(r.opening_time)} —
 ${esc(r.closing_time)}</p>

 <p>Расонидан: ${esc(money(r.delivery_fee))}</p>

 <p>Фармоиши ҳадди ақал:

 ${esc(money(r.minimum_order))}</p>

 </div>

 `;

 $("restaurantMenu").innerHTML =

 foods.filter(f=>f.restaurant_id===id)

 .map(foodCard).join("")

 || '<div class="empty">Меню ҳоло холӣ аст.</div>';

 showScreen("restaurantScreen");

}

async function loadFavorites(){

 favorites = new Set();

 if(!user) return;

 const {data,error} = await db

 .from("food_favorites")

 .select("restaurant_id")

 .eq("user_id",user.id);

 if(error) throw error;

 favorites = new Set(

 (data || []).map(i=>i.restaurant_id)

 );

}

async function toggleFavorite(id){

 try{

 if(!await requireUser()) return;

 let result;

 if(favorites.has(id)){

 result = await db

 .from("food_favorites")

 .delete()

 .eq("user_id",user.id)

 .eq("restaurant_id",id);

 if(result.error) throw result.error;

 favorites.delete(id);

 }else{

 result = await db

 .from("food_favorites")

 .upsert({

 user_id:user.id,
 restaurant_id:id

 });

 if(result.error) throw result.error;

 favorites.add(id);

 }

 renderHome();

 if(currentScreen==="favoritesScreen"){

 renderFavorites();

 }

 }catch(error){

 notice(error.message);

 }

}

function renderFavorites(){

 $("favorites").innerHTML =

 restaurants.filter(r=>favorites.has(r.id))

 .map(restaurantCard).join("")

 || '<div class="empty">Рӯйхат холӣ аст.</div>';

}

async function openFavorites(){

 try{

 if(!await requireUser()) return;

 await loadFavorites();

 renderFavorites();

 showScreen("favoritesScreen");

 }catch(error){

 notice(error.message);

 }

}

function addToCart(id){

 if(busy) return;

 const f = foods.find(f=>f.id===id);

 if(!f) return;

 const r = restaurants.find(

 r=>r.id===f.restaurant_id

 );

 if(!r?.is_open){

 notice("Тарабхона пӯшида аст.");

 return;

 }

 const first = foods.find(

 f=>f.id===cart[0]?.id

 );

 if(cart.length &&

 (!first || first.restaurant_id!==f.restaurant_id)){

 if(!confirm(

 "Сабадро холӣ карда, аз ин тарабхона фармоиш медиҳед?"

 )) return;

 cart = [];

 }

 const item = cart.find(i=>i.id===id);

 if(item){

 item.quantity = Math.min(99,item.quantity+1);

 }else{

 cart.push({id,quantity:1});

 }

 saveCart();

 notice("Таом ба сабад илова шуд.");

}

function changeQuantity(id,delta){

 if(busy) return;

 const item = cart.find(i=>i.id===id);

 if(!item) return;

 item.quantity = Math.min(

 99,item.quantity+delta

 );

 cart = cart.filter(i=>i.quantity>0);

 saveCart();

 renderCart();

}

function cartDetails(){

 const items = cart.map(i=>({

 ...i,

 food:foods.find(f=>f.id===i.id)

 }));

 const valid = items.filter(i=>i.food);

 const restaurant = restaurants.find(

 r=>r.id===valid[0]?.food.restaurant_id

 );

 const subtotal = valid.reduce(

 (sum,i)=>sum+currentPrice(i.food)*i.quantity,0

 );

 const fee = Number(restaurant?.delivery_fee || 0);

 return {

 items,

 valid,

 restaurant,

 subtotal,

 fee,

 total:subtotal+fee

 };

}

function validateCart(){

 const d = cartDetails();

 if(!cart.length){

 throw new Error("Сабад холӣ аст.");

 }

 if(d.valid.length!==cart.length){

 throw new Error(

 "Баъзе таомҳо дастрас нестанд. Онҳоро аз сабад хориҷ кунед."

 );

 }

 if(!d.restaurant?.is_open){

 throw new Error("Тарабхона пӯшида аст.");

 }

 if(d.valid.some(i=>

 i.food.restaurant_id!==d.restaurant.id

 )){

 throw new Error("Танҳо аз як тарабхона фармоиш диҳед.");

 }

 if(d.subtotal<Number(d.restaurant.minimum_order)){

 throw new Error(

 "Фармоиши ҳадди ақал: "

 +money(d.restaurant.minimum_order)

 );

 }

 return d;

}

function snapshot(d){

 return JSON.stringify({

 items:d.valid.map(i=>[

 i.id,i.quantity,currentPrice(i.food)

 ]),

 restaurant:d.restaurant?.id,

 fee:d.fee,

 minimum:d.restaurant?.minimum_order

 });

}

function totalsHTML(d){

 return `

 <p>Таомҳо: ${esc(money(d.subtotal))}</p>

 <p>Расонидан: ${esc(money(d.fee))}</p>

 <p>Комиссияи VAYO: 0%</p>

 <div class="total">

 Ҳамагӣ: ${esc(money(d.total))}

 </div>

 `;

}

function renderCart(){

 const d = cartDetails();

 $("cartContent").innerHTML =

 d.items.map(i=>`

 <div class="cartItem">

 <strong>

 ${esc(i.food?.name || "Таоми дастнорас")}

 </strong>

 <p>${i.food

 ? esc(money(currentPrice(i.food)*i.quantity))

 : "Дастрас нест"}

 </p>

 <div class="qty">

 <button class="gray"
 data-action="minus"
 data-id="${esc(i.id)}">−</button>

 <strong>${i.quantity}</strong>

 <button class="gray"
 data-action="plus"
 data-id="${esc(i.id)}"
 ${i.food?"":"disabled"}>＋</button>

 <button class="red"
 data-action="remove"
 data-id="${esc(i.id)}">✕</button>

 </div>

 </div>

 `).join("")

 + (cart.length

 ? totalsHTML(d)

 : "<p>Сабад холӣ аст.</p>");

 $("checkoutButton").disabled = !cart.length;

}

function openCart(){

 $("cartError").textContent = "";

 renderCart();

 if(!$("cartDialog").open){

 $("cartDialog").showModal();

 }

}

async function openCheckout(){

 if(busy) return;

 try{

 const guestCart = !user ? [...cart] : null;

 if(!await requireUser()) return;

 if(guestCart?.length && !cart.length){

 cart = guestCart;

 saveCart();

 }

 await loadCatalog();

 const d = validateCart();

 checkoutSnapshot = snapshot(d);

 gps = null;

 gpsVersion++;

 $("gpsInfo").textContent = "";

 $("customerName").value =

 user.user_metadata?.full_name || "";

 $("customerPhone").value =

 user.user_metadata?.phone || "";

 $("deliveryCity").value = d.restaurant.city;

 $("checkoutTotal").innerHTML = totalsHTML(d);

 $("checkoutError").textContent = "";

 $("cartDialog").close();

 $("checkoutDialog").showModal();

 }catch(error){

 $("cartError").textContent = error.message;

 renderCart();

 }

}

function closeCheckout(){

 if(busy) return;

 gpsVersion++;

 $("checkoutDialog").close();

 openCart();

}

function getGPS(){

 if(busy) return;

 if(!navigator.geolocation){

 $("gpsInfo").textContent = "GPS дастрас нест.";

 return;

 }

 const version = ++gpsVersion;

 $("gpsInfo").textContent = "GPS ҷустуҷӯ мешавад...";

 navigator.geolocation.getCurrentPosition(

 position=>{

 if(version!==gpsVersion) return;

 gps = {

 lat:position.coords.latitude,

 lng:position.coords.longitude

 };

 $("gpsInfo").textContent =

 "GPS илова шуд: "

 +gps.lat.toFixed(5)+", "

 +gps.lng.toFixed(5);

 },

 error=>{

 if(version!==gpsVersion) return;

 $("gpsInfo").textContent =

 "GPS дастрас нест: "+error.message;

 },

 {

 enableHighAccuracy:true,

 timeout:15000,

 maximumAge:5000

 }

 );

}

$("checkoutForm").addEventListener(

 "submit",async event=>{

 event.preventDefault();

 if(busy) return;

 busy = true;

 $("confirmButton").disabled = true;

 $("checkoutError").textContent = "";

 try{

 await loadCatalog();

 const d = validateCart();

 if(snapshot(d)!==checkoutSnapshot){

 checkoutSnapshot = snapshot(d);

 $("checkoutTotal").innerHTML = totalsHTML(d);

 throw new Error(

 "Нарх тағйир ёфт. Маблағи навро санҷида, боз тасдиқ кунед."

 );

 }

 const name = $("customerName").value.trim();

 const phone = normalizePhone(

 $("customerPhone").value

 );

 const street = $("deliveryStreet").value.trim();

 if(!name || !street){

 throw new Error("Ном ва суроғаро ворид кунед.");

 }

 const address = [

 d.restaurant.city,

 street,

 $("apartment").value.trim()

 ].filter(Boolean).join(", ");

 await rpc("vayo_create_food_order",{

 p_restaurant_id:d.restaurant.id,

 p_items:d.valid.map(i=>({

 food_id:i.id,

 quantity:i.quantity

 })),

 p_customer_name:name,

 p_customer_phone:phone,

 p_delivery_address:address,

 p_lat:gps?.lat ?? null,

 p_lng:gps?.lng ?? null,

 p_note:$("note").value.trim(),

 p_call_on_arrival:$("callOnArrival").checked

 });

 cart = [];

 saveCart();

 gpsVersion++;

 $("checkoutDialog").close();

 $("checkoutForm").reset();

 notice("Фармоиш ба тарабхона фиристода шуд!");

 showScreen("ordersScreen");

 await loadOrders();

 }catch(error){

 $("checkoutError").textContent = error.message;

 }finally{

 busy = false;

 $("confirmButton").disabled = false;

 }

 });

$("checkoutDialog").addEventListener(

 "cancel",event=>{

 if(busy){

 event.preventDefault();

 }else{

 gpsVersion++;

 }

 });

function trackingHTML(status){

 const steps = [

 ["pending","Фармоиш сабт шуд"],

 ["accepted","Тарабхона қабул кард"],

 ["preparing","Таом омода мешавад"],

 ["ready","Таом омода аст"],

 ["delivering","Расонанда дар роҳ"],

 ["completed","Расонида шуд"]

 ];

 if(status==="cancelled"){

 return "<p>❌ Фармоиш бекор шуд.</p>";

 }

 const index = steps.findIndex(

 s=>s[0]===status

 );

 return `<div class="steps">

 ${steps.map(([key,label],i)=>`

 <div class="step ${i<=index?"done":""}">

 ${i<=index?"✓":"○"} ${label}

 </div>

 `).join("")}

 </div>`;

}

async function courierHTML(order){

 if(!order.courier_id ||

 !["ready","delivering"].includes(order.status)){

 return "";

 }

 try{

 const result = await rpc("vayo_my_courier",{

 p_order_id:order.id

 });

 const c = Array.isArray(result)

 ? result[0]

 : result;

 if(!c) return "";

 const tel = String(c.phone || "")

 .replace(/[^\d+]/g,"");

 const fresh = c.location_updated_at

 && Date.now()-new Date(

 c.location_updated_at

 ).getTime()<120000;

 const mapLink = fresh

 && c.latitude!==null

 && c.longitude!==null

 ? `<a class="btn gray"

 href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.latitude+","+c.longitude)}"

 target="_blank" rel="noopener noreferrer">

 📍 Ҷойгиршавии расонанда

 </a>`

 : "<p>GPS-и нав дастрас нест.</p>";

 return `

 <div class="panel">

 <h3>🛵 Расонандаи шумо</h3>

 <p>${esc(c.full_name)}</p>

 <a class="btn green" href="tel:${esc(tel)}">

 📞 Занг задан

 </a>

 <br><br>

 ${mapLink}

 </div>

 `;

 }catch{

 return "<p>Маълумоти расонанда ҳоло дастрас нест.</p>";

 }

}

async function loadOrders(){

 if(!user || loadingOrders) return;

 loadingOrders = true;

 try{

 const {data,error} = await db

 .from("food_orders")

 .select("*,food_order_items(*)")

 .eq("customer_id",user.id)

 .order("created_at",{ascending:false})

 .limit(100);

 if(error) throw error;

 const rows = await Promise.all(

 (data || []).map(async o=>{

 const r = restaurants.find(

 r=>r.id===o.restaurant_id

 );

 const courier = await courierHTML(o);

 return `

 <article class="panel">

 <span class="badge">

 ${esc(statuses[o.status] || o.status)}

 </span>

 <h3>${esc(r?.name || "Тарабхона")}</h3>

 <small>Фармоиш #${esc(o.id.slice(0,8))}</small>

 <p>${esc(new Date(o.created_at)

 .toLocaleString("ru-RU",{

 timeZone:"Asia/Dushanbe"

 }))}</p>

 ${(o.food_order_items || []).map(i=>`

 <p>${esc(i.food_name)} × ${esc(i.quantity)}</p>

 `).join("")}

 <p>📍 ${esc(o.delivery_address)}</p>

 <p>Расонидан: ${esc(money(o.delivery_fee))}</p>

 <div class="total">

 ${esc(money(o.total))}

 </div>

 ${trackingHTML(o.status)}

 ${courier}

 ${o.status==="pending"

 ? `<button class="red full"

 data-action="cancel"

 data-id="${esc(o.id)}">

 Бекор кардани фармоиш

 </button>`

 : ""}

 ${o.status==="completed"

 ? `<button class="gray full"

 data-action="review"

 data-id="${esc(o.id)}">

 ⭐ Баҳо додан

 </button>`

 : ""}

 </article>

 `;

 })

 );

 $("orders").innerHTML = rows.join("")

 || '<div class="empty">Ҳоло фармоиш надоред.</div>';

 }catch(error){

 notice(error.message);

 }finally{

 loadingOrders = false;

 }

}

async function openOrders(){

 try{

 if(!await requireUser()) return;

 showScreen("ordersScreen");

 await loadOrders();

 }catch(error){

 notice(error.message);

 }

}

async function cancelOrder(id){

 if(busy) return;

 if(!confirm("Фармоишро бекор мекунед?")) return;

 busy = true;

 try{

 await rpc("vayo_food_status",{

 p_order_id:id,

 p_status:"cancelled"

 });

 await loadOrders();

 notice("Фармоиш бекор шуд.");

 }catch(error){

 notice(error.message);

 }finally{

 busy = false;

 }

}

async function reviewOrder(id){

 if(busy) return;

 const input = prompt(

 "Ба тарабхона аз 1 то 5 баҳо диҳед:","5"

 );

 if(input===null) return;

 const rating = Number(input);

 if(!Number.isInteger(rating)

 || rating<1 || rating>5){

 notice("Баҳо бояд аз 1 то 5 бошад.");

 return;

 }

 const comment = prompt("Назари шумо:","");

 if(comment===null) return;

 if(comment.length>1000){

 notice("Матн хеле дароз аст.");

 return;

 }

 busy = true;

 try{

 await rpc("vayo_food_review",{

 p_order_id:id,

 p_rating:rating,

 p_comment:comment

 });

 notice("Ташаккур барои баҳо!");

 }catch(error){

 notice(error.message);

 }finally{

 busy = false;

 }

}

document.addEventListener("click",event=>{

 const category = event.target.closest(

 "[data-category]"

 );

 if(category){

 selectedCategory = category.dataset.category;

 renderCategories();

 renderHome();

 return;

 }

 const b = event.target.closest("[data-action]");

 if(!b || busy) return;

 const {action,id} = b.dataset;

 if(action==="restaurant") openRestaurant(id);

 if(action==="favorite") toggleFavorite(id);

 if(action==="add") addToCart(id);

 if(action==="plus") changeQuantity(id,1);

 if(action==="minus") changeQuantity(id,-1);

 if(action==="remove"){

 cart = cart.filter(i=>i.id!==id);

 saveCart();

 renderCart();

 }

 if(action==="cancel") cancelOrder(id);

 if(action==="review") reviewOrder(id);

});

$("search").addEventListener("input",()=>{

 if(currentScreen!=="homeScreen"){

 showScreen("homeScreen");

 }

 renderHome();

});

$("city").addEventListener("change",async()=>{

 if(busy) return;

 try{

 selectedCategory = "Ҳама";

 renderCategories();

 showScreen("homeScreen");

 await loadCatalog();

 }catch(error){

 notice(error.message);

 }

});

async function start(){

 try{

 if(!db){

 throw new Error("config.js ёфт нашуд.");

 }

 const savedCity = localStorage.getItem("vayo_city");

 if([...$("city").options].some(

 o=>o.value===savedCity

 )){

 $("city").value = savedCity;

 }

 const {data} = await db.auth.getUser();

 user = data?.user || null;

 readCart();

 renderCategories();

 await loadFavorites();

 await loadCatalog();

 }catch(error){

 notice(error.message);

 }

}

setInterval(()=>{

 if(user && !busy

 && currentScreen==="ordersScreen"

 && document.visibilityState==="visible"){

 loadOrders();

 }

},8000);

start();

</script>
