<script>

const db = window.vayo;
const $ = id => document.getElementById(id);

let currentPage = "dashboard";
let pageVersion = 0;
let busy = false;

const titles = {
 dashboard:"Панели асосӣ",
 users:"Корбарон",
 products:"Маҳсулот",
 orders:"Фармоишҳои Marketplace",
 drivers:"Ронандагон",
 taxi:"Фармоишҳои Taxi",
 restaurants:"Тарабхонаҳо",
 food:"Фармоишҳои Food",
 couriers:"Расонандагон",
 earnings:"Даромади расонандагон",
 tariffs:"Тарифҳои Taxi",
 banners:"Баннерҳои рекламавӣ",
 language:"Омӯзиши забонҳо",
 logs:"Таърихи амалиёт"
};

function esc(value){
 return String(value ?? "").replace(
  /[&<>"']/g,
  c => ({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  })[c]
 );
}

function money(value){
 return Number(value || 0).toFixed(2) + " TJS";
}

function date(value){
 if(!value) return "—";
 return new Date(value).toLocaleString("ru-RU",{
  timeZone:"Asia/Dushanbe"
 });
}

function notice(text){
 $("notice").textContent = text || "";
}

function badge(value){
 return value
 ? '<span class="badge ok">Фаъол</span>'
 : '<span class="badge">Ғайрифаъол</span>';
}

function button(label,action,id,value,color="green"){

 return `<button
 class="btn ${color}"
 data-action="${esc(action)}"
 data-id="${esc(id)}"
 data-value="${esc(value)}"
 >${esc(label)}</button>`;

}

function table(headers,rows){

 if(!rows.length){
  return '<div class="panel">Маълумот ҳоло нест.</div>';
 }

 return `
 <div class="panel table-wrap">
 <table>
 <thead><tr>
 ${headers.map(h=>`<th>${esc(h)}</th>`).join("")}
 </tr></thead>
 <tbody>
 ${rows.map(row=>`
 <tr>${row.map(c=>`<td>${c}</td>`).join("")}</tr>
 `).join("")}
 </tbody>
 </table>
 </div>`;

}

async function query(name,columns="*"){

 const {data,error} = await db
 .from(name)
 .select(columns)
 .limit(200);

 if(error) throw error;

 return data || [];

}

async function rpc(name,args={}){

 const {data,error} = await db.rpc(name,args);

 if(error) throw error;

 return data;

}

async function dashboard(){

 const d = await rpc("vayo_admin_dashboard");

 const metrics = [
  ["👥 Корбарон",d.users],
  ["🛍 Маҳсулот",d.products],
  ["📦 Фармоишҳои Market",d.marketplace_orders],
  ["💰 Фурӯши Market",money(d.marketplace_sales)],
  ["🚕 Ронандагон",d.taxi_drivers],
  ["⏳ Ронандагони нав",d.pending_drivers],
  ["🗺 Сафарҳои Taxi",d.taxi_orders],
  ["💰 Фурӯши Taxi",money(d.taxi_sales)],
  ["🍔 Тарабхонаҳо",d.restaurants],
  ["⏳ Тарабхонаҳои нав",d.pending_restaurants],
  ["🍕 Фармоишҳои Food",d.food_orders],
  ["💰 Фурӯши Food",money(d.food_sales)],
  ["🛵 Расонандагон",d.couriers],
  ["⏳ Расонандагони нав",d.pending_couriers],
  ["💵 Даромади расонандагон",money(d.courier_earnings)],
  ["🏦 Комиссияи VAYO","0%"]
 ];

 return `
 <div class="grid">
 ${metrics.map(([name,value])=>`
  <div class="card">
   <div class="label">${esc(name)}</div>
   <div class="metric">${esc(value)}</div>
  </div>
 `).join("")}
 </div>

 <div class="panel">
  <h2>VAYO-APP</h2>
  <p>Панели марказии идоракунии хизматрасониҳо.</p>
  <p>Marketplace · Taxi · Food · Language</p>
 </div>`;

}

async function users(){

 const data = await rpc("vayo_admin_users",{
  p_limit:200,
  p_offset:0
 });

 return table(
 ["Ном","Email","Телефон","Сана"],
 data.map(u=>[
  esc(u.full_name),
  esc(u.email),
  esc(u.phone),
  esc(date(u.created_at))
 ])
 );

}

async function products(){

 const data = await query("products");

 return table(
 ["Маҳсулот","Фурӯшанда","Нарх","Захира","Ҳолат","Идоракунӣ"],
 data.map(p=>[
  esc(p.name),
  esc(p.seller_name),
  esc(money(p.price)),
  esc(p.stock),
  badge(p.active),
  button(
   p.active?"Пинҳон кардан":"Фаъол кардан",
   "product",p.id,!p.active,
   p.active?"red":"green"
  )
 ])
 );

}

async function logs(){

 const {data,error} = await db
 .from("admin_logs")
 .select("*")
 .order("created_at",{ascending:false})
 .limit(200);

 if(error) throw error;

 return table(
 ["Амалиёт","Объект","Маълумот","Сана"],
 (data || []).map(l=>[
  esc(l.action),
  esc(l.target_id),
  esc(JSON.stringify(l.details)),
  esc(date(l.created_at))
 ])
 );

}

const pages = {
 dashboard,users,products,orders,
 drivers,taxi,restaurants,food,
 couriers,earnings,tariffs,
 banners,language,logs
};

async function openPage(page){

 if(!pages[page]) return;

 const version = ++pageVersion;

 currentPage = page;

 $("pageTitle").textContent = titles[page];
 $("sidebar").classList.remove("open");

 document.querySelectorAll(".nav[data-page]")
 .forEach(b=>b.classList.toggle(
  "active",b.dataset.page===page
 ));

 notice("");

 $("content").innerHTML =
 '<div class="panel">Боргирӣ...</div>';

 try{

  const html = await pages[page]();

  if(version === pageVersion){
   $("content").innerHTML = html;
  }

 }catch(error){

  if(version === pageVersion){
   $("content").innerHTML = "";
   notice(error.message);
  }

 }

}

async function change(action,id,value){

 if(busy) return;

 if(!confirm("Ин амалро тасдиқ мекунед?")) return;

 busy = true;

 try{

 const enabled = value === "true";

 if(action==="driver"){
  await rpc("vayo_admin_approve_driver",{
   p_driver_id:id,
   p_approved:enabled
  });
 }

 if(action==="restaurant"){
  await rpc("vayo_admin_approve_restaurant",{
   p_restaurant_id:id,
   p_approved:enabled
  });
 }

 if(action==="courier"){
  await rpc("vayo_admin_approve_courier",{
   p_courier_id:id,
   p_approved:enabled
  });
 }

 if(action==="product"){
  await rpc("vayo_admin_product_status",{
   p_product_id:id,
   p_active:enabled
  });
 }

 if(action==="banner"){

  const {error} = await db

async function insertRow(table,row){

 const {error} = await db.from(table).insert(row);

 if(error) throw error;

}

async function saveForm(form){

 if(busy) return;

 busy = true;

 const submit = form.querySelector("button[type=submit],button");

 if(submit) submit.disabled = true;

 const f = new FormData(form);

 const get = key => String(f.get(key) || "").trim();

 try{

 if(form.dataset.form==="tariff"){

  await rpc("vayo_admin_taxi_tariff",{
   p_car_class:form.dataset.id,
   p_base_price:Number(get("base")),
   p_price_per_km:Number(get("km"))
  });

 }

 if(form.dataset.form==="banner"){

  const file = f.get("image");

  if(!file || !file.size || file.size>5242880){
   throw new Error("Акс бояд то 5 MB бошад.");
  }

  const types = {
   "image/jpeg":"jpg",
   "image/png":"png",
   "image/webp":"webp"
  };

  const ext = types[file.type];

  if(!ext) throw new Error("Формати акс нодуруст.");

  const link = get("link");

  if(link && new URL(link).protocol!=="https:"){
   throw new Error("Истинод бояд HTTPS бошад.");
  }

  const path = crypto.randomUUID()+"."+ext;

  const {error} = await db.storage
  .from("vayo-banners")
  .upload(path,file);

  if(error) throw error;

  const {data} = db.storage
  .from("vayo-banners")
  .getPublicUrl(path);

  try{

   await insertRow("vayo_banners",{
    title:get("title"),
    description:get("description"),
    service:get("service"),
    image_url:data.publicUrl,
    link_url:link || null,
    active:true
   });

  }catch(error){

   await db.storage.from("vayo-banners")
   .remove([path]);

   throw error;

  }

 }

 if(form.dataset.form==="course"){

  await insertRow("language_courses",{
   language_id:get("language_id"),
   title:get("title"),
   level:get("level"),
   description:get("description"),
   active:true
  });

 }

 if(form.dataset.form==="lesson"){

  await insertRow("language_lessons",{
   course_id:get("course_id"),
   title:get("title"),
   description:get("description"),
   position:Number(get("position")),
   xp:Number(get("xp")),
   active:true
  });

 }

 if(form.dataset.form==="word"){

  await insertRow("language_words",{
   lesson_id:get("lesson_id"),
   word:get("word"),
   translation:get("translation"),
   pronunciation:get("pronunciation")
  });

 }

 if(form.dataset.form==="exercise"){

  const options = [
   get("a"),get("b"),get("c")
  ];

  if(new Set(options).size!==3){
   throw new Error("Ҷавобҳо бояд гуногун бошанд.");
  }

  await insertRow("language_exercises",{
   lesson_id:get("lesson_id"),
   exercise_type:"choice",
   question:get("question"),
   options,
   correct_answer:get(get("correct"))
  });

 }

 await openPage(currentPage);

 notice("Маълумот сабт шуд.");

 }catch(error){

  notice(error.message);

 }finally{

  busy = false;

  if(submit) submit.disabled = false;

 }

}

document.addEventListener("click",event=>{

 const page = event.target.closest("[data-page]");

 if(page){
  openPage(page.dataset.page);
  return;
 }

 const action = event.target.closest("[data-action]");

 if(action){

  change(
   action.dataset.action,
   action.dataset.id,
   action.dataset.value
  );

 }

});

document.addEventListener("submit",event=>{

 const form = event.target;

 if(form.matches("[data-form]")){
  event.preventDefault();
  saveForm(form);
 }

});

async function logout(){

 const {error} = await db.auth.signOut();

 if(error){
  notice(error.message);
  return;
 }

 location.href="./account.html";

}

async function start(){

 try{

  if(!db){
   throw new Error("config.js нодуруст аст.");
  }

  const {data,error} = await db.auth.getUser();

  if(error || !data.user){
   throw new Error("Аввал ба аккаунт ворид шавед.");
  }

  const admin = await rpc("vayo_is_admin");

  if(admin !== true){
   throw new Error("Шумо ҳуқуқи Super Admin надоред.");
  }

  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");

  await openPage("dashboard");

 }catch(error){

  $("gateMessage").textContent = error.message;

 }

}

start();

</script>
