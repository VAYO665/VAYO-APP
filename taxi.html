
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffcc00">
<title>VAYO Taxi</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

body{
 margin:0;
 font-family:Arial,sans-serif;
 color:#191919;
 background:#e9ece7;
}

button,input,textarea{
 font:inherit;
}

button{
 border:0;
 cursor:pointer;
}

button:disabled{
 opacity:.5;
 cursor:not-allowed;
}

a{
 text-decoration:none;
 color:inherit;
}

#map{
 position:fixed;
 inset:0;
 z-index:1;
 background:#e5e8df;
}

.topbar{
 position:fixed;
 top:16px;
 left:15px;
 right:15px;
 z-index:500;
 display:flex;
 justify-content:space-between;
 align-items:center;
 pointer-events:none;
}

.topbar>*{
 pointer-events:auto;
}

.round{
 width:49px;
 height:49px;
 border-radius:18px;
 background:white;
 box-shadow:0 4px 18px #0002;
 display:grid;
 place-items:center;
 font-size:23px;
}

.logo{
 background:white;
 padding:13px 19px;
 border-radius:18px;
 font-size:21px;
 font-weight:900;
 color:#ff6500;
 box-shadow:0 4px 18px #0002;
}

.sheet{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:100%;
 max-width:550px;
 max-height:60dvh;
 overflow-y:auto;
 background:white;
 border-radius:28px 28px 0 0;
 z-index:600;
 padding:10px 17px 20px;
 padding-bottom:max(20px,env(safe-area-inset-bottom));
 box-shadow:0 -8px 35px #0002;
 transition:max-height .25s;
}

.sheet.expanded{
 max-height:88dvh;
}

.handle{
 width:100%;
 height:20px;
 background:transparent;
 display:flex;
 justify-content:center;
 align-items:center;
}

.handle:after{
 content:"";
 width:42px;
 height:5px;
 background:#d5d5d5;
 border-radius:20px;
}

h1{
 font-size:26px;
 margin:9px 0 16px;
 letter-spacing:-1px;
}

h2{
 font-size:19px;
 margin:15px 0;
}

.addresses{
 background:#f3f3f5;
 border-radius:19px;
 padding:6px 14px;
}

.address-row{
 display:flex;
 align-items:center;
 gap:12px;
 padding:10px 0;
}

.address-row+ .address-row{
 border-top:1px solid #ddd;
}

.address-row input{
 border:0;
 outline:0;
 background:transparent;
 width:100%;
 min-width:0;
 padding:6px 0;
 font-size:15px;
 font-weight:bold;
}

.dot{
 width:13px;
 height:13px;
 border-radius:50%;
 background:#23ae63;
 flex-shrink:0;
}

.dot.destination{
 background:#ff6500;
}

.search-btn{
 background:white;
 padding:9px;
 border-radius:12px;
}

.results button{
 width:100%;
 text-align:left;
 padding:12px;
 background:white;
 margin-top:4px;
 border-radius:12px;
 font-size:13px;
}

.map-tools{
 display:flex;
 gap:8px;
 margin-top:10px;
}

.map-tools button{
 flex:1;
 background:#f3f3f5;
 border-radius:13px;
 padding:12px 6px;
 font-size:12px;
 font-weight:bold;
}

.gps-status{
 color:#777;
 font-size:12px;
 margin:12px 0;
 line-height:1.5;
}

.cars{
 display:flex;
 overflow-x:auto;
 gap:9px;
 padding:5px 0 10px;
 scrollbar-width:none;
}

.cars::-webkit-scrollbar{
 display:none;
}

.car{
 min-width:122px;
 flex:1;
 background:#f5f5f5;
 border:2px solid transparent;
 border-radius:19px;
 padding:10px;
 text-align:left;
}

.car.selected{
 background:#fff9dd;
 border-color:#ffcc00;
}

.car svg{
 width:100%;
 height:62px;
}

.car-name{
 font-weight:bold;
 font-size:15px;
}

.car-price{
 font-weight:900;
 font-size:16px;
 margin-top:7px;
}

.car-desc{
 font-size:11px;
 color:#777;
 margin-top:4px;
}

.trip{
 display:flex;
 justify-content:space-between;
 background:#f5f5f5;
 border-radius:14px;
 padding:12px;
 font-size:13px;
 margin:8px 0;
}

.order-btn{
 width:100%;
 background:#ffcc00;
 border-radius:19px;
 color:#111;
 padding:18px;
 font-size:18px;
 font-weight:900;
 margin-top:12px;
}

.commission{
 text-align:center;
 color:#159447;
 font-size:12px;
 margin:10px 0;
 font-weight:bold;
}

.field{
 margin-bottom:12px;
}

.field label{
 display:block;
 font-size:13px;
 margin-bottom:6px;
 font-weight:bold;
}

.field input,.field textarea{
 width:100%;
 padding:15px;
 background:#f4f4f5;
 border:1px solid #eee;
 border-radius:15px;
 outline:none;
}

.check{
 display:flex;
 align-items:center;
 gap:10px;
 font-size:14px;
 padding:10px 0;
}

.check input{
 accent-color:#ff6500;
 width:19px;
 height:19px;
}

.payment{
 background:#f3f3f5;
 padding:15px;
 border-radius:15px;
 margin:10px 0;
}

dialog{
 border:0;
 border-radius:25px;
 padding:22px;
 width:min(94%,450px);
 max-height:85dvh;
 overflow:auto;
}

dialog::backdrop{
 background:#0008;
}

.close-btn{
 background:#eee;
 width:100%;
 padding:15px;
 border-radius:15px;
 margin-top:10px;
}

.menu-btn{
 width:100%;
 background:#f4f4f5;
 text-align:left;
 padding:16px;
 border-radius:15px;
 margin-bottom:8px;
}

.summary{
 background:#f4f4f5;
 padding:15px;
 border-radius:15px;
 line-height:1.8;
 font-size:14px;
 overflow-wrap:anywhere;
}

.toast{
 position:fixed;
 top:85px;
 left:50%;
 transform:translateX(-50%);
 background:#222;
 color:white;
 z-index:2000;
 padding:14px 18px;
 border-radius:15px;
 font-size:13px;
 width:max-content;
 max-width:90%;
}

.hidden{
 display:none!important;
}

@media(min-width:800px){
 .sheet{
  left:20px;
  bottom:20px;
  transform:none;
  width:420px;
  max-height:82dvh;
  border-radius:25px;
 }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="topbar">

 <button class="round"
 onclick="openMenu()">☰</button>

 <div class="logo">VAYO Taxi</div>

 <button class="round"
 onclick="getLocation()">◎</button>

</div>

<section class="sheet" id="sheet">

 <button class="handle"
 aria-label="Калон ё хурд кардани панел"
 onclick="toggleSheet()"></button>

 <h1>Ба куҷо меравем?</h1>

 <div class="addresses">

  <div class="address-row">
   <span class="dot"></span>

   <input id="from"
   placeholder="Ҷойгиршавии шумо"
   aria-label="Суроғаи оғоз">

   <button class="search-btn"
   onclick="searchAddress('from')">⌕</button>
  </div>

  <div id="fromResults" class="results"></div>

  <div class="address-row">
   <span class="dot destination"></span>

   <input id="to"
   placeholder="Ба куҷо?"
   aria-label="Суроғаи таъинот">

   <button class="search-btn"
   onclick="searchAddress('to')">⌕</button>
  </div>

  <div id="toResults" class="results"></div>

 </div>

 <div class="map-tools">

  <button onclick="getLocation()">
   📍 Ҷойи ман
  </button>

  <button onclick="pickOnMap('from')">
   Аз харита: оғоз
  </button>

  <button onclick="pickOnMap('to')">
   Таъинот
  </button>

 </div>

 <div class="gps-status" id="status">
  Ҷойгиршавӣ муайян шуда истодааст...
 </div>

 <h2>Мошинро интихоб кунед</h2>

 <div class="cars" id="cars"></div>

 <div class="trip">
  <span id="distance">— км</span>
  <span id="duration">— дақ</span>
  <strong id="price">— TJS</strong>
 </div>

 <button class="order-btn"
 id="orderBtn"
 onclick="openBooking()"
 disabled>
  Такси фармоиш додан
 </button>

 <div class="commission">
  VAYO · 0% комиссия
 </div>

</section>

<!-- BOOKING -->

<dialog id="booking">

 <h2>Фармоиши такси</h2>

 <div id="bookingSummary" class="summary"></div>

 <form id="bookingForm">

  <br>

  <div class="field">
   <label for="name">Номи мусофир</label>
   <input id="name" required maxlength="100"
   autocomplete="name"
   placeholder="Номи шумо">
  </div>

  <div class="field">
   <label for="phone">Рақами телефон</label>
   <input id="phone" required type="tel"
   autocomplete="tel"
   placeholder="+992 90 123 45 67">
  </div>

  <div class="field">
   <label for="note">Шарҳи иловагӣ</label>
   <textarea id="note" rows="2" maxlength="300"
   placeholder="Дар назди даромадгоҳ..."></textarea>
  </div>

  <label class="check">
   <input id="callOnArrival" type="checkbox" checked>
   Вақте расидед, занг занед
  </label>

  <div class="payment">
   💵 Пардохт бо пули нақд
  </div>

  <button class="order-btn" type="submit">
   Тасдиқи фармоиш
  </button>

 </form>

 <button class="close-btn"
 onclick="document.getElementById('booking').close()">
  Бекор кардан
 </button>

</dialog>

<!-- MENU -->

<dialog id="menu">

 <h2>VAYO Taxi</h2>

 <button class="menu-btn"
 onclick="location.href='./index.html'">
  🏠 Саҳифаи асосӣ
 </button>

 <button class="menu-btn"
 onclick="location.href='./account.html'">
  👤 Аккаунти ман
 </button>

 <button class="menu-btn"
 onclick="showHistory()">
  📋 Таърихи сафарҳо
 </button>

 <button class="menu-btn"
 onclick="location.href='./driver.html'">
  🚕 Барои ронандагон
 </button>

 <button class="close-btn"
 onclick="document.getElementById('menu').close()">
  Пӯшидан
 </button>

</dialog>

<dialog id="history">
 <h2>Таърихи сафарҳо</h2>
 <div id="historyList"></div>

 <button class="close-btn"
 onclick="document.getElementById('history').close()">
  Пӯшидан
 </button>
</dialog>

<dialog id="success">

 <div style="text-align:center;font-size:60px">🚕</div>

 <h2 style="text-align:center">
  Фармоиши озмоишӣ сабт шуд
 </h2>

 <p style="color:#777;text-align:center;line-height:1.6">
  Пайвастшавӣ ба ронандагони воқеӣ
  ҳанӯз фаъол нест.
 </p>

 <button class="order-btn"
 onclick="document.getElementById('success').close()">
  Фаҳмо
 </button>

</dialog>

<div class="toast hidden" id="toast"></div>

<script>

const $ = id => document.getElementById(id);

const tariffs = {
 economy:{
  name:"Economy",
  base:5,
  km:2.5,
  color:"#f4f4f4",
  desc:"4 ҷой"
 },
 comfort:{
  name:"Comfort",
  base:8,
  km:3.5,
  color:"#bfc9d3",
  desc:"4 ҷой"
 },
 business:{
  name:"Business",
  base:12,
  km:5,
  color:"#30343b",
  desc:"4 ҷой"
 },
 minivan:{
  name:"Minivan",
  base:15,
  km:5.5,
  color:"#e4e4e4",
  desc:"6 ҷой"
 }
};

let selectedCar = "economy";

let points = {
 from:null,
 to:null
};

let markers = {
 from:null,
 to:null
};

let versions = {
 from:0,
 to:0
};

let routeLine = null;
let routeVersion = 0;
let controller = null;
let ready = false;
let distanceKm = 0;
let durationMin = 0;
let mapMode = "to";
let pending = null;
let toastTimer;
let lastGeo = 0;
let geoQueue = Promise.resolve();

const HISTORY_KEY = "vayo_taxi_orders_v3";

// MAP

const map = L.map("map",{
 zoomControl:false
}).setView([38.5598,68.7870],14);

L.tileLayer(
 "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  maxZoom:19,
  attribution:"© OpenStreetMap contributors"
 }
).addTo(map);

map.attributionControl.setPosition("topleft");

function status(text){
 $("status").textContent = text;
}

function toast(text){
 clearTimeout(toastTimer);

 $("toast").textContent = text;
 $("toast").classList.remove("hidden");

 toastTimer = setTimeout(()=>{
  $("toast").classList.add("hidden");
 },3500);
}

function toggleSheet(){
 $("sheet").classList.toggle("expanded");
}

function markerIcon(type){

 const color = type==="from"
  ? "#3287ff"
  : "#ff6500";

 return L.divIcon({
  className:"",
  html:`<div style="
  width:26px;
  height:26px;
  background:${color};
  border:4px solid white;
  border-radius:50%;
  box-shadow:0 2px 12px #0005;
  "></div>`,
  iconSize:[26,26],
  iconAnchor:[13,13]
 });
}

// GEOCODING

function geoRequest(url){

 const task = geoQueue.then(async()=>{

  const wait = Math.max(
   0,1100-(Date.now()-lastGeo)
  );

  await new Promise(resolve=>
   setTimeout(resolve,wait)
  );

  lastGeo = Date.now();

  const response = await fetch(url);

  if(!response.ok){
   throw new Error("Geocoding failed");
  }

  return response.json();

 });

 geoQueue = task.catch(()=>{});

 return task;
}

async function reverseAddress(lat,lng){

 const params = new URLSearchParams({
  format:"jsonv2",
  lat:String(lat),
  lon:String(lng),
  "accept-language":"tg,ru,en"
 });

 const data = await geoRequest(
  "https://nominatim.openstreetmap.org/reverse?"
  +params
 );

 return data.display_name ||
  `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
}

// GPS

function getLocation(){

 if(!navigator.geolocation){
  status("GPS дастрас нест.");
  return;
 }

 const version = ++versions.from;

 status("Ҷойгиршавӣ муайян шуда истодааст...");

 navigator.geolocation.getCurrentPosition(

  async position=>{

   if(version!==versions.from)return;

   const lat = position.coords.latitude;
   const lng = position.coords.longitude;

   setPoint(
    "from",lat,lng,
    `${lat.toFixed(5)}, ${lng.toFixed(5)}`
   );

   map.setView([lat,lng],17);

   if(window.innerWidth<800){
    map.panBy([0,$("sheet").offsetHeight/2]);
   }

   status(
    "GPS фаъол · дақиқӣ "+
    Math.round(position.coords.accuracy)+" м"
   );

   try{

    const address = await reverseAddress(lat,lng);

    if(version===versions.from && points.from){
     $("from").value = address;
     points.from.address = address;
    }

   }catch(error){
    status("GPS ёфт шуд. Номи суроға дастрас нест.");
   }

  },

  error=>{

   if(version!==versions.from)return;

   status("GPS дастрас нест. Суроғаро интихоб кунед.");

   toast("Барои GPS иҷозат диҳед.");

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:0
  }

 );
}

// POINTS

function setPoint(type,lat,lng,address){

 points[type] = {lat,lng,address};

 $(type).value = address;

 $(type+"Results").replaceChildren();

 if(markers[type]){
  map.removeLayer(markers[type]);
 }

 markers[type] = L.marker(
  [lat,lng],
  {icon:markerIcon(type)}
 ).addTo(map);

 calculateRoute();
}

function invalidateRoute(){

 routeVersion++;

 if(controller){
  controller.abort();
 }

 if(routeLine){
  map.removeLayer(routeLine);
  routeLine = null;
 }

 ready = false;
 distanceKm = 0;
 durationMin = 0;

 renderCars();
 updatePrice();
}

function clearPoint(type){

 versions[type]++;

 points[type] = null;

 if(markers[type]){
  map.removeLayer(markers[type]);
  markers[type] = null;
 }

 $(type+"Results").replaceChildren();

 invalidateRoute();
}

["from","to"].forEach(type=>{

 $(type).addEventListener("input",()=>{
  clearPoint(type);
 });

 $(type).addEventListener("keydown",event=>{

  if(event.key==="Enter"){
   event.preventDefault();
   searchAddress(type);
  }

 });

});

// ADDRESS SEARCH

async function searchAddress(type){

 const query = $(type).value.trim();

 if(query.length<3){
  toast("Суроғаро нависед.");
  return;
 }

 const version = ++versions[type];

 const results = $(type+"Results");

 results.replaceChildren();

 status("Ҷустуҷӯи суроға...");

 try{

  const params = new URLSearchParams({
   q:query,
   format:"jsonv2",
   countrycodes:"tj",
   limit:"5",
   "accept-language":"tg,ru,en"
  });

  const data = await geoRequest(
   "https://nominatim.openstreetmap.org/search?"
   +params
  );

  if(version!==versions[type])return;

  if(!data.length){
   status("Суроға ёфт нашуд.");
   toast("Аз харита интихоб кунед.");
   return;
  }

  data.forEach(place=>{

   const button = document.createElement("button");

   button.textContent = place.display_name;

   button.onclick = ()=>{

    versions[type]++;

    const lat = Number(place.lat);
    const lng = Number(place.lon);

    map.setView([lat,lng],16);

    setPoint(
     type,lat,lng,place.display_name
    );

   };

   results.appendChild(button);

  });

  status("Суроғаро интихоб кунед.");

 }catch(error){

  if(version!==versions[type])return;

  status("Ҷустуҷӯ дастрас нест.");

 }

}

// MAP SELECTION

function pickOnMap(type){

 mapMode = type;

 $("sheet").classList.remove("expanded");

 status(
  type==="from"
   ? "Ҷойи оғозро дар харита пахш кунед."
   : "Ҷойи таъинотро дар харита пахш кунед."
 );

}

map.on("click",async event=>{

 const type = mapMode;

 const version = ++versions[type];

 const lat = event.latlng.lat;
 const lng = event.latlng.lng;

 setPoint(
  type,lat,lng,
  `${lat.toFixed(5)}, ${lng.toFixed(5)}`
 );

 try{

  const address = await reverseAddress(lat,lng);

  if(version===versions[type] && points[type]){
   points[type].address = address;
   $(type).value = address;
  }

 }catch(error){}

});

// ROUTE

async function calculateRoute(){

 invalidateRoute();

 if(!points.from || !points.to)return;

 const version = routeVersion;

 controller = new AbortController();

 status("Масир ҳисоб шуда истодааст...");

 try{

  const a = points.from;
  const b = points.to;

  const url =
   "https://router.project-osrm.org/route/v1/driving/"
   +a.lng+","+a.lat+";"
   +b.lng+","+b.lat
   +"?overview=full&geometries=geojson";

  const response = await fetch(url,{
   signal:controller.signal
  });

  if(!response.ok){
   throw new Error("Route failed");
  }

  const data = await response.json();

  if(version!==routeVersion)return;

  if(data.code!=="Ok" || !data.routes?.length){
   throw new Error("No route");
  }

  const route = data.routes[0];

  distanceKm = route.distance/1000;

  durationMin = Math.max(
   1,Math.ceil(route.duration/60)
  );

  routeLine = L.geoJSON(route.geometry,{
   style:{
    color:"#ff9d00",
    weight:7,
    opacity:1
   }
  }).addTo(map);

  const mobile = window.innerWidth<800;

  map.fitBounds(routeLine.getBounds(),{
   paddingTopLeft:mobile?[35,85]:[450,85],
   paddingBottomRight:mobile
    ?[35,$("sheet").offsetHeight+20]
    :[35,35],
   maxZoom:16
  });

  ready = true;

  renderCars();
  updatePrice();

  status("Масир омода аст.");

 }catch(error){

  if(error.name==="AbortError" ||
     version!==routeVersion)return;

  status("Масир ҳисоб нашуд. Боз кӯшиш кунед.");

 }

}

// CAR ILLUSTRATIONS

function carSVG(type){

 const color = tariffs[type].color;

 const van = type==="minivan";

 return `
 <svg viewBox="0 0 180 90">
  <ellipse cx="90" cy="79"
   rx="80" ry="6" fill="#0002"/>

  <path d="${van
   ?"M20 55L29 14H138L160 55Z"
   :"M22 55L55 25H115L150 55Z"}"
   fill="${color}" stroke="#999"/>

  <path d="${van
   ?"M38 21H130L145 49H33Z"
   :"M47 50L61 31H111L133 50Z"}"
   fill="#465569"/>

  <rect x="8" y="48" width="164"
   height="27" rx="12"
   fill="${color}" stroke="#999"/>

  <rect x="10" y="54" width="22"
   height="9" rx="4" fill="#ffda55"/>

  <rect x="150" y="54" width="19"
   height="9" rx="4" fill="#ef4444"/>

  <circle cx="43" cy="73" r="14" fill="#222"/>
  <circle cx="138" cy="73" r="14" fill="#222"/>

  <circle cx="43" cy="73" r="6" fill="#aaa"/>
  <circle cx="138" cy="73" r="6" fill="#aaa"/>

  <text x="90" y="65" text-anchor="middle"
   font-size="10" font-weight="bold"
   fill="#ff6500">VAYO</text>
 </svg>`;
}

function getPrice(type){

 if(!ready)return null;

 const t = tariffs[type];

 return Math.round(
  (t.base+distanceKm*t.km)*100
 )/100;
}

function renderCars(){

 $("cars").replaceChildren();

 Object.entries(tariffs).forEach(([key,car])=>{

  const button = document.createElement("button");

  button.className = "car"+
   (key===selectedCar?" selected":"");

  const price = getPrice(key);

  button.innerHTML = `
   ${carSVG(key)}
   <div class="car-name">${car.name}</div>
   <div class="car-desc">${car.desc}</div>
   <div class="car-price">
    ${price===null?"—":price.toFixed(2)} TJS
   </div>
  `;

  button.onclick = ()=>{

   selectedCar = key;

   renderCars();
   updatePrice();

  };

  $("cars").appendChild(button);

 });

}

function updatePrice(){

 $("distance").textContent =
  ready?distanceKm.toFixed(1)+" км":"— км";

 $("duration").textContent =
  ready?durationMin+" дақ":"— дақ";

 const price = getPrice(selectedCar);

 $("price").textContent =
  price===null?"— TJS":price.toFixed(2)+" TJS";

 $("orderBtn").disabled = !ready;

 $("orderBtn").textContent =
  ready
  ?"Фармоиш · "+price.toFixed(2)+" TJS"
  :"Такси фармоиш додан";
}

// BOOKING

function openBooking(){

 if(!ready || !points.from || !points.to){
  toast("Аввал суроғаҳоро интихоб кунед.");
  return;
 }

 pending = {
  id:crypto.randomUUID(),
  from:{...points.from},
  to:{...points.to},
  car:tariffs[selectedCar].name,
  carType:selectedCar,
  distance:Number(distanceKm.toFixed(2)),
  duration:durationMin,
  price:getPrice(selectedCar),
  commission:0,
  created:new Date().toISOString()
 };

 $("bookingSummary").replaceChildren();

 [
  "Аз: "+pending.from.address,
  "Ба: "+pending.to.address,
  "Мошин: "+pending.car,
  "Масофа: "+pending.distance+" км",
  "Нарх: "+pending.price.toFixed(2)+" TJS"
 ].forEach(text=>{

  const div = document.createElement("div");

  div.textContent = text;

  $("bookingSummary").appendChild(div);

 });

 $("booking").showModal();
}

function normalizePhone(value){

 let digits = value.replace(/\D/g,"");

 if(digits.startsWith("00992")){
  digits = digits.slice(2);
 }

 if(digits.length===9){
  digits = "992"+digits;
 }

 return /^992\d{9}$/.test(digits)
  ?"+"+digits
  :null;
}

function readHistory(){

 try{

  const data = JSON.parse(
   localStorage.getItem(HISTORY_KEY)||"[]"
  );

  return Array.isArray(data)?data:[];

 }catch(error){

  return [];

 }

}

$("bookingForm").addEventListener("submit",event=>{

 event.preventDefault();

 if(!pending)return;

 const phone = normalizePhone($("phone").value);

 if(!phone){
  toast("Рақами телефонро дуруст нависед.");
  return;
 }

 if(!$("name").value.trim()){
  toast("Номи худро нависед.");
  return;
 }

 // Demo: personal details are not stored.
 // Real orders require a secure backend.

 const saved = {
  id:pending.id,
  car:pending.car,
  distance:pending.distance,
  duration:pending.duration,
  price:pending.price,
  created:pending.created,
  status:"demo"
 };

 try{

  const orders = readHistory();

  orders.unshift(saved);

  localStorage.setItem(
   HISTORY_KEY,
   JSON.stringify(orders.slice(0,50))
  );

 }catch(error){

  toast("Фармоиш сабт нашуд.");
  return;

 }

 pending = null;

 $("booking").close();

 $("success").showModal();

});

$("booking").addEventListener("close",()=>{
 pending = null;
});

// MENU AND HISTORY

function openMenu(){
 $("menu").showModal();
}

function showHistory(){

 $("menu").close();

 const list = $("historyList");

 list.replaceChildren();

 const orders = readHistory();

 if(!orders.length){

  list.textContent = "Ҳоло сафарҳо нестанд.";

 }else{

  orders.forEach(order=>{

   const card = document.createElement("div");

   card.className = "summary";
   card.style.marginBottom = "10px";

   [
    "🚕 "+order.car,
    order.distance+" км",
    order.price+" TJS",
    "Ҳолат: Озмоишӣ",
    new Date(order.created).toLocaleString("ru-RU")
   ].forEach(text=>{

    const line = document.createElement("div");

    line.textContent = text;

    card.appendChild(line);

   });

   list.appendChild(card);

  });

 }

 $("history").showModal();

}

// START

renderCars();
updatePrice();

window.addEventListener("load",()=>{
 getLocation();
});

</script>
