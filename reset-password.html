
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>VAYO — Пароли нав</title>

<script>
window.recoveryParams = {
 query: new URLSearchParams(location.search),
 hash: new URLSearchParams(location.hash.slice(1))
};
history.replaceState(null,"",location.pathname);
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#f5f6f8;
font-family:Arial,sans-serif;
color:#222;
}

header{
background:white;
padding:20px;
text-align:center;
color:#ff6500;
font-size:30px;
font-weight:900;
}

main{
max-width:450px;
margin:40px auto;
padding:16px;
}

.card{
background:white;
padding:25px;
border-radius:24px;
box-shadow:0 5px 25px #00000010;
}

.logo{
width:80px;
height:80px;
margin:0 auto 20px;
background:#fff0df;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
}

h2,p{
text-align:center;
}

label{
display:block;
font-weight:bold;
margin:15px 0 8px;
}

input{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:#ff6500;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

button:disabled{
opacity:.5;
}

.message{
background:#fff0df;
padding:15px;
border-radius:12px;
margin-top:15px;
overflow-wrap:anywhere;
}

.message:empty{
display:none;
}

.hidden{
display:none!important;
}

a{
display:block;
text-align:center;
margin-top:20px;
color:#ff6500;
text-decoration:none;
}

</style>
</head>

<body>

<header>VAYO</header>

<main>

<div class="card">

<div class="logo">🔐</div>

<h2>Барқарор кардани парол</h2>

<p id="status">
Истинод санҷида мешавад...
</p>

<form id="passwordForm" class="hidden">

<label>Пароли нав</label>

<input
id="password"
type="password"
minlength="8"
autocomplete="new-password"
placeholder="Камаш 8 аломат"
required>

<label>Пароли навро такрор кунед</label>

<input
id="confirmPassword"
type="password"
minlength="8"
autocomplete="new-password"
placeholder="Паролро такрор кунед"
required>

<label style="font-weight:normal">

<input
id="showPassword"
type="checkbox"
style="width:auto">

Нишон додани парол

</label>

<button id="saveButton" type="submit">

Сабт кардани пароли нав

</button>

</form>

<div id="message" class="message" role="status"></div>

<a href="./account.html">

← Бозгашт ба аккаунт

</a>

</div>

</main>

<script>

const db = window.vayo;

const $ = id => document.getElementById(id);

const params = window.recoveryParams;

let ready = false;

let recoveryUserId = null;

let busy = false;

function message(text){

$("message").textContent = text;

}

async function start(){

try{

if(!db){

throw new Error(
"Пайвастшавӣ ба Supabase дастрас нест."
);

}

const query = params.query;
const hash = params.hash;

const error = query.get("error")
|| hash.get("error");

if(error){

throw new Error(
"Истинод нодуруст аст ё муҳлаташ гузаштааст."
);

}

const tokenHash = query.get("token_hash");

const accessToken = hash.get("access_token");

const refreshToken = hash.get("refresh_token");

const type = query.get("type")
|| hash.get("type");

let result;

if(tokenHash && type === "recovery"){

result = await db.auth.verifyOtp({

token_hash: tokenHash,

type: "recovery"

});

}else if(
accessToken &&
refreshToken &&
type === "recovery"
){

result = await db.auth.setSession({

access_token: accessToken,

refresh_token: refreshToken

});

}else{

throw new Error(
"Истиноди нави барқароркуниро аз Email кушоед."
);

}

if(result.error){

throw result.error;

}

if(!result.data?.session){

throw new Error(
"Сессияи барқароркунӣ дастрас нест."
);

}

recoveryUserId = result.data.session.user.id;

ready = true;

$("status").textContent =
"Пароли нави худро ворид кунед.";

$("passwordForm").classList.remove("hidden");

}catch(error){

ready = false;

$("status").textContent =
"Барқарор кардани парол имконнопазир шуд.";

message(error.message);

}finally{

params.query = new URLSearchParams();

params.hash = new URLSearchParams();

}

}

$("showPassword").onchange = function(){

const type = this.checked ?
"text" : "password";

$("password").type = type;

$("confirmPassword").type = type;

};

$("passwordForm").onsubmit = async event => {

event.preventDefault();

if(!ready || busy)return;

const password = $("password").value;

const confirmPassword =
$("confirmPassword").value;

if(password.length < 8){

message(
"Парол бояд камаш 8 аломат дошта бошад."
);

return;

}

if(password !== confirmPassword){

message("Паролҳо якхела нестанд.");

return;

}

busy = true;

$("saveButton").disabled = true;

message("Парол сабт мешавад...");

try{

const {data,error:sessionError} =
await db.auth.getUser();

if(
sessionError ||
data?.user?.id !== recoveryUserId
){

throw new Error(
"Сессия тағйир ёфт. Истиноди нав гиред."
);

}

const {error} = await db.auth.updateUser({

password: password

});

if(error)throw error;

ready = false;

$("passwordForm").reset();

$("passwordForm").classList.add("hidden");

$("status").textContent =
"✓ Парол бомуваффақият иваз шуд!";

message(
"Акнун бо пароли нав ворид шавед."
);

const signOutResult = await db.auth.signOut();

if(signOutResult.error){

message(
"Парол иваз шуд. Аз аккаунт бароед ва бо пароли нав ворид шавед."
);

return;

}

setTimeout(()=>{

location.replace("./account.html");

},2000);

}catch(error){

message(error.message);

}finally{

busy = false;

$("saveButton").disabled = false;

}

};

start();

</script>

</body>
</html>
